<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Focus Ticket — Pomodoro & Todo</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1c1b1a">
<style>
  :root{
    --bg: #1c1b1a;
    --surface: #262422;
    --surface-raised: #2f2c29;
    --accent: #e4572e;
    --accent-soft: rgba(228,87,46,0.14);
    --sage: #7fa583;
    --amber: #d9a441;
    --teal: #5b8a86;
    --text: #f2ece4;
    --muted: #948d84;
    --line: #3a3733;
  }

  body.theme-break{
    --accent: #7fa583;
    --accent-soft: rgba(127,165,131,0.16);
  }

  * { box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 10%, rgba(228,87,46,0.06), transparent 40%),
      var(--bg);
    color:var(--text);
    font-family:'Inter', sans-serif;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:56px 20px;
    transition:background .4s;
  }

  .app{ width:100%; max-width:980px; }

  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    margin-bottom:40px;
    flex-wrap:wrap;
    gap:16px;
  }

  .kicker{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--accent);
    margin:0 0 6px;
    transition:color .4s;
  }

  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(28px, 4vw, 40px);
    margin:0;
    letter-spacing:-0.01em;
  }

  .session-count{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    color:var(--muted);
    text-align:right;
  }
  .session-count strong{ color:var(--text); font-size:16px; }

  .grid{
    display:grid;
    grid-template-columns: 380px 1fr;
    gap:28px;
  }
  @media (max-width: 780px){
    .grid{ grid-template-columns: 1fr; }
  }

  /* ---------- Timer panel ---------- */
  .timer-panel{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:18px;
    padding:28px 24px 32px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .modes{
    display:flex;
    gap:6px;
    background:var(--bg);
    padding:4px;
    border-radius:10px;
    margin-bottom:24px;
    width:100%;
  }
  .mode-btn{
    flex:1;
    border:none;
    background:transparent;
    color:var(--muted);
    font-family:'Inter', sans-serif;
    font-size:12.5px;
    font-weight:500;
    padding:9px 6px;
    border-radius:7px;
    cursor:pointer;
    transition:background .2s, color .2s;
  }
  .mode-btn.active{
    background:var(--surface-raised);
    color:var(--text);
  }

  .util-row{
    display:flex;
    justify-content:flex-end;
    width:100%;
    margin-bottom:10px;
  }
  .icon-toggle{
    background:none;
    border:1px solid var(--line);
    color:var(--muted);
    border-radius:7px;
    width:32px; height:32px;
    font-size:14px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:border-color .15s, color .15s;
  }
  .icon-toggle.active-state{ color:var(--accent); border-color:var(--accent); }

  .dial-wrap{
    position:relative;
    width:250px;
    height:250px;
    margin-bottom:26px;
  }
  .dial-wrap svg{ transform:rotate(-90deg); }

  .dial-track{ fill:none; stroke:var(--bg); stroke-width:10; }
  .dial-progress{
    fill:none;
    stroke:var(--accent);
    stroke-width:10;
    stroke-linecap:round;
    transition:stroke-dashoffset 1s linear, stroke .4s;
  }

  .dial-center{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }
  .time{
    font-family:'IBM Plex Mono', monospace;
    font-size:44px;
    font-weight:600;
    letter-spacing:0.01em;
  }
  .phase-label{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:0.12em;
    color:var(--muted);
    margin-top:6px;
  }

  .controls{ display:flex; gap:10px; }
  .btn{
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:13.5px;
    border-radius:9px;
    padding:12px 22px;
    border:1px solid var(--line);
    background:var(--surface-raised);
    color:var(--text);
    cursor:pointer;
    transition:transform .12s, background .15s, border-color .15s;
  }
  .btn:hover{ border-color:var(--accent); }
  .btn:active{ transform:scale(0.96); }
  .btn.primary{
    background:var(--accent);
    border-color:var(--accent);
    color:#1c1b1a;
    transition:background .4s, border-color .4s, transform .12s;
  }
  .btn.ghost{ background:transparent; }

  /* ---------- Todo panel ---------- */
  .todo-panel{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:18px;
    padding:26px 24px;
    display:flex;
    flex-direction:column;
  }

  .tabs{
    display:flex;
    gap:4px;
    margin-bottom:18px;
    border-bottom:1px solid var(--line);
  }
  .tab-btn{
    background:none;
    border:none;
    color:var(--muted);
    font-family:'Fraunces', serif;
    font-size:15.5px;
    font-weight:600;
    padding:6px 4px 12px;
    margin-right:18px;
    cursor:pointer;
    border-bottom:2px solid transparent;
    transition:color .15s, border-color .15s;
  }
  .tab-btn.active{
    color:var(--text);
    border-color:var(--accent);
  }

  .todo-heading{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
  }
  .todo-heading span{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--muted);
  }

  .add-row{
    display:flex;
    gap:8px;
    margin-bottom:20px;
  }
  .add-row input[type="text"]{
    flex:1;
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:9px;
    padding:12px 14px;
    color:var(--text);
    font-family:'Inter', sans-serif;
    font-size:14px;
    outline:none;
  }
  .add-row input[type="text"]:focus{ border-color:var(--accent); }
  .add-row input::placeholder{ color:var(--muted); }

  .priority-select{
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:9px;
    color:var(--text);
    font-family:'Inter', sans-serif;
    font-size:13px;
    padding:0 8px;
  }

  .add-row button.add-submit{
    background:var(--accent);
    color:#1c1b1a;
    border:none;
    border-radius:9px;
    width:44px;
    font-size:20px;
    font-weight:600;
    cursor:pointer;
    transition:transform .12s;
  }
  .add-row button.add-submit:active{ transform:scale(0.92); }

  .todo-list{
    list-style:none;
    margin:0; padding:0;
    display:flex;
    flex-direction:column;
    gap:10px;
    max-height:420px;
    overflow-y:auto;
  }

  .ticket{
    position:relative;
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--surface-raised);
    border-radius:10px;
    padding:14px 16px 14px 14px;
    border:1px dashed var(--line);
  }
  .ticket::before, .ticket::after{
    content:"";
    position:absolute;
    width:14px; height:14px;
    background:var(--bg);
    border-radius:50%;
    top:50%;
    transform:translateY(-50%);
  }
  .ticket::before{ left:-7px; }
  .ticket::after{ right:-7px; }

  .priority-dot{
    flex-shrink:0;
    width:9px; height:9px;
    border-radius:50%;
  }
  .priority-dot.high{ background:var(--accent); }
  .priority-dot.medium{ background:var(--amber); }
  .priority-dot.low{ background:var(--teal); }

  .check{
    flex-shrink:0;
    width:20px; height:20px;
    border-radius:50%;
    border:2px solid var(--muted);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:border-color .15s, background .15s;
  }
  .check.done{
    background:var(--sage);
    border-color:var(--sage);
  }
  .check.done::after{
    content:"✓";
    font-size:12px;
    color:#1c1b1a;
    font-weight:700;
  }

  .ticket-text{
    flex:1;
    font-size:14.5px;
    line-height:1.4;
    word-break:break-word;
  }
  .ticket-text.done{
    color:var(--muted);
    text-decoration:line-through;
  }

  .tag{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    color:var(--accent);
    background:var(--accent-soft);
    padding:3px 8px;
    border-radius:20px;
    white-space:nowrap;
  }

  .del{
    background:none;
    border:none;
    color:var(--muted);
    cursor:pointer;
    font-size:16px;
    line-height:1;
    padding:4px;
    flex-shrink:0;
  }
  .del:hover{ color:var(--accent); }

  .empty-state{
    text-align:center;
    padding:36px 12px;
    color:var(--muted);
    font-size:13.5px;
  }
  .empty-state .stub{
    font-family:'Fraunces', serif;
    font-size:15px;
    color:var(--text);
    margin-bottom:4px;
  }

  /* ---------- Log tab ---------- */
  .log-week{
    margin-bottom:20px;
  }
  .log-week-header{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:8px;
    padding-bottom:6px;
    border-bottom:1px solid var(--line);
  }
  .log-week-header h3{
    font-family:'Fraunces', serif;
    font-size:14.5px;
    font-weight:600;
    margin:0;
  }
  .log-week-header span{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    color:var(--muted);
  }
  .log-entry{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 0;
    font-size:13.5px;
  }
  .log-entry .log-text{ flex:1; color:var(--text); }
  .log-entry .log-time{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--muted);
    white-space:nowrap;
  }

  ::-webkit-scrollbar{ width:6px; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:10px; }

  /* ---------- Side panels (Spotify + Alarms) ---------- */
  .side-panel{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:18px;
    padding:24px;
  }
  .side-heading{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:16px;
  }
  .side-heading h2{
    font-family:'Fraunces', serif;
    font-size:18px;
    font-weight:600;
    margin:0;
  }
  .side-heading span{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    color:var(--muted);
  }
  .side-copy{
    font-size:13.5px;
    color:var(--muted);
    line-height:1.5;
    margin:0 0 16px;
  }
  .now-playing{
    background:var(--surface-raised);
    border:1px dashed var(--line);
    border-radius:10px;
    padding:14px;
    font-size:13px;
    color:var(--muted);
    margin-top:14px;
    word-break:break-word;
  }
  input[type="time"]{
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:9px;
    color:var(--text);
    font-family:'Inter', sans-serif;
    font-size:13px;
    padding:0 10px;
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <div>
      <p class="kicker" id="kickerLabel">Focus Ticket</p>
      <h1>Pomodoro & tasks</h1>
    </div>
    <div class="session-count">
      Sessions completed<br>
      <strong id="sessionCount">0</strong>
    </div>
  </header>

  <div class="grid">

    <!-- Timer -->
    <div class="timer-panel">
      <div class="modes">
        <button class="mode-btn active" data-mins="25" data-label="Focus">Focus 25</button>
        <button class="mode-btn" data-mins="5" data-label="Short break">Short 5</button>
        <button class="mode-btn" data-mins="15" data-label="Long break">Long 15</button>
      </div>

      <div class="util-row">
        <button class="icon-toggle active-state" id="soundToggle" title="Toggle sound">♪</button>
      </div>

      <div class="dial-wrap">
        <svg width="250" height="250" viewBox="0 0 250 250">
          <circle class="dial-track" cx="125" cy="125" r="105"></circle>
          <circle id="dialProgress" class="dial-progress" cx="125" cy="125" r="105"
            stroke-dasharray="659.7" stroke-dashoffset="0"></circle>
        </svg>
        <div class="dial-center">
          <div class="time" id="timeDisplay">25:00</div>
          <div class="phase-label" id="phaseLabel">Focus</div>
        </div>
      </div>

      <div class="controls">
        <button class="btn primary" id="startBtn">Start</button>
        <button class="btn ghost" id="resetBtn">Reset</button>
      </div>
    </div>

    <!-- Todos -->
    <div class="todo-panel">
      <div class="tabs">
        <button class="tab-btn active" data-tab="today">Today</button>
        <button class="tab-btn" data-tab="week">This week</button>
        <button class="tab-btn" data-tab="log">Log</button>
      </div>

      <div id="taskView">
        <div class="todo-heading">
          <span id="todoCount">0 open</span>
        </div>

        <div class="add-row">
          <input type="text" id="todoInput" placeholder="Add a task, then press Enter…" maxlength="140">
          <select class="priority-select" id="prioritySelect">
            <option value="high">High</option>
            <option value="medium" selected>Medium</option>
            <option value="low">Low</option>
          </select>
          <button class="add-submit" id="addBtn">+</button>
        </div>

        <ul class="todo-list" id="todoList"></ul>
      </div>

      <div id="logView" style="display:none;">
        <div class="todo-list" id="logList" style="max-height:480px;"></div>
      </div>
    </div>

  </div>

  <div class="grid" style="margin-top:20px;">

    <!-- Spotify -->
    <div class="side-panel">
      <div class="side-heading">
        <h2>Soundtrack</h2>
        <span>No login needed</span>
      </div>

      <p class="side-copy">Paste a Spotify track, album, or playlist link to play it here while you focus.</p>

      <div class="add-row">
        <input type="text" id="spotifyLinkInput" placeholder="Paste a Spotify link…">
        <button class="add-submit" id="spotifyLoadBtn">▶</button>
      </div>

      <div id="spotifyEmbedWrap" style="margin-top:14px;"></div>
    </div>

    <!-- Alarms -->
    <div class="side-panel">
      <div class="side-heading">
        <h2>Task alarms</h2>
        <span id="alarmCount">0 set</span>
      </div>

      <div class="add-row">
        <input type="text" id="alarmLabelInput" placeholder="What's this alarm for?" maxlength="80">
        <input type="time" id="alarmTimeInput" class="priority-select" style="width:120px;">
        <button class="add-submit" id="addAlarmBtn">+</button>
      </div>

      <ul class="todo-list" id="alarmList"></ul>
    </div>

  </div>
</div>
<footer style="text-align:center; font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:#948d84; letter-spacing:0.04em; margin:36px 0 8px;">built by rawwn :)</footer>
<script>
  // ---------- Sound ----------
  let soundOn = true;
  const soundToggle = document.getElementById('soundToggle');
  soundToggle.addEventListener('click', () => {
    soundOn = !soundOn;
    soundToggle.classList.toggle('active-state', soundOn);
  });

  function playChime(){
    if(!soundOn) return;
    try{
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const notes = [880, 1108, 1318];
      notes.forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.value = freq;
        osc.type = 'sine';
        gain.gain.setValueAtTime(0.001, ctx.currentTime + i * 0.18);
        gain.gain.linearRampToValueAtTime(0.2, ctx.currentTime + i * 0.18 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.18 + 0.35);
        osc.connect(gain).connect(ctx.destination);
        osc.start(ctx.currentTime + i * 0.18);
        osc.stop(ctx.currentTime + i * 0.18 + 0.4);
      });
    } catch(e){ /* audio not available */ }
  }

  // ---------- Timer logic ----------
  const modeBtns = document.querySelectorAll('.mode-btn');
  const timeDisplay = document.getElementById('timeDisplay');
  const phaseLabel = document.getElementById('phaseLabel');
  const kickerLabel = document.getElementById('kickerLabel');
  const startBtn = document.getElementById('startBtn');
  const resetBtn = document.getElementById('resetBtn');
  const dialProgress = document.getElementById('dialProgress');
  const sessionCountEl = document.getElementById('sessionCount');

  const CIRCUMFERENCE = 2 * Math.PI * 105;
  dialProgress.setAttribute('stroke-dasharray', CIRCUMFERENCE.toFixed(1));

  let totalSeconds = 25 * 60;
  let remaining = totalSeconds;
  let timerId = null;
  let running = false;
  let sessions = 0;

  function formatTime(s){
    const m = Math.floor(s / 60).toString().padStart(2,'0');
    const sec = (s % 60).toString().padStart(2,'0');
    return `${m}:${sec}`;
  }

  function updateDisplay(){
    timeDisplay.textContent = formatTime(remaining);
    const fraction = remaining / totalSeconds;
    const offset = CIRCUMFERENCE * (1 - fraction);
    dialProgress.style.strokeDashoffset = offset.toFixed(1);
  }

  function applyBreakTheme(isBreak){
    document.body.classList.toggle('theme-break', isBreak);
    kickerLabel.textContent = isBreak ? 'Break Ticket' : 'Focus Ticket';
  }

  function setMode(mins, label, btn){
    modeBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    pause();
    totalSeconds = mins * 60;
    remaining = totalSeconds;
    phaseLabel.textContent = label;
    applyBreakTheme(label !== 'Focus');
    updateDisplay();
  }

  modeBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      setMode(Number(btn.dataset.mins), btn.dataset.label, btn);
    });
  });

  function tick(){
    if(remaining <= 0){
      pause();
      playChime();
      if(phaseLabel.textContent === 'Focus'){
        sessions++;
        sessionCountEl.textContent = sessions;
      }
      phaseLabel.textContent = 'Done!';
      return;
    }
    remaining--;
    updateDisplay();
  }

  function start(){
    if(running) return;
    running = true;
    startBtn.textContent = 'Pause';
    timerId = setInterval(tick, 1000);
  }

  function pause(){
    running = false;
    startBtn.textContent = 'Start';
    clearInterval(timerId);
  }

  startBtn.addEventListener('click', () => running ? pause() : start());

  resetBtn.addEventListener('click', () => {
    pause();
    remaining = totalSeconds;
    const activeBtn = document.querySelector('.mode-btn.active');
    phaseLabel.textContent = activeBtn.dataset.label;
    updateDisplay();
  });

  updateDisplay();

  // ---------- Todo logic ----------
  const todoInput = document.getElementById('todoInput');
  const prioritySelect = document.getElementById('prioritySelect');
  const addBtn = document.getElementById('addBtn');
  const todoList = document.getElementById('todoList');
  const todoCount = document.getElementById('todoCount');
  const logList = document.getElementById('logList');
  const taskView = document.getElementById('taskView');
  const logView = document.getElementById('logView');
  const tabBtns = document.querySelectorAll('.tab-btn');

  let currentTab = 'today';
  let todos = [];        // {id, text, done, priority, list: 'today'|'week'}
  let completedLog = []; // {id, text, priority, list, completedAt: Date}
  let idCounter = 0;

  const priorityRank = { high: 0, medium: 1, low: 2 };

  tabBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      tabBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentTab = btn.dataset.tab;
      taskView.style.display = currentTab === 'log' ? 'none' : 'block';
      logView.style.display = currentTab === 'log' ? 'block' : 'none';
      if(currentTab === 'log'){
        renderLog();
      } else {
        renderTodos();
      }
    });
  });

  function renderTodos(){
    const list = todos
      .filter(t => t.list === currentTab)
      .sort((a,b) => priorityRank[a.priority] - priorityRank[b.priority]);

    todoList.innerHTML = '';

    if(list.length === 0){
      const label = currentTab === 'week' ? 'this week' : 'today';
      todoList.innerHTML = `
        <li class="empty-state">
          <div class="stub">No tickets yet</div>
          Add a task above to plan ${label}.
        </li>`;
    } else {
      list.forEach(todo => {
        const li = document.createElement('li');
        li.className = 'ticket';
        li.innerHTML = `
          <span class="priority-dot ${todo.priority}"></span>
          <div class="check ${todo.done ? 'done' : ''}" data-id="${todo.id}"></div>
          <span class="ticket-text ${todo.done ? 'done' : ''}">${todo.text}</span>
          <span class="tag">#${String(todo.id).padStart(3,'0')}</span>
          <button class="del" data-id="${todo.id}">✕</button>
        `;
        todoList.appendChild(li);
      });
    }

    const openCount = todos.filter(t => t.list === currentTab && !t.done).length;
    todoCount.textContent = `${openCount} open`;
  }

  function getWeekLabel(date){
    const d = new Date(date);
    const day = (d.getDay() + 6) % 7; // Mon = 0
    const monday = new Date(d);
    monday.setDate(d.getDate() - day);
    const sunday = new Date(monday);
    sunday.setDate(monday.getDate() + 6);
    const opts = { month: 'short', day: 'numeric' };
    return `Week of ${monday.toLocaleDateString(undefined, opts)} – ${sunday.toLocaleDateString(undefined, opts)}`;
  }

  function renderLog(){
    logList.innerHTML = '';

    if(completedLog.length === 0){
      logList.innerHTML = `
        <li class="empty-state">
          <div class="stub">Nothing logged yet</div>
          Completed tasks will show up here, grouped by week.
        </li>`;
      return;
    }

    const groups = {};
    completedLog
      .slice()
      .sort((a,b) => b.completedAt - a.completedAt)
      .forEach(entry => {
        const label = getWeekLabel(entry.completedAt);
        if(!groups[label]) groups[label] = [];
        groups[label].push(entry);
      });

    Object.keys(groups).forEach(label => {
      const wrap = document.createElement('div');
      wrap.className = 'log-week';
      wrap.innerHTML = `
        <div class="log-week-header">
          <h3>${label}</h3>
          <span>${groups[label].length} completed</span>
        </div>
      `;
      groups[label].forEach(entry => {
        const row = document.createElement('div');
        row.className = 'log-entry';
        const timeStr = entry.completedAt.toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric' });
        row.innerHTML = `
          <span class="priority-dot ${entry.priority}"></span>
          <span class="log-text">${entry.text}</span>
          <span class="tag">${entry.list === 'week' ? 'Week' : 'Today'}</span>
          <span class="log-time">${timeStr}</span>
        `;
        wrap.appendChild(row);
      });
      logList.appendChild(wrap);
    });
  }

  function addTodo(){
    const value = todoInput.value.trim();
    if(!value) return;
    idCounter++;
    todos.unshift({
      id: idCounter,
      text: value,
      done: false,
      priority: prioritySelect.value,
      list: currentTab === 'week' ? 'week' : 'today'
    });
    todoInput.value = '';
    renderTodos();
  }

  addBtn.addEventListener('click', addTodo);
  todoInput.addEventListener('keydown', e => {
    if(e.key === 'Enter') addTodo();
  });

  todoList.addEventListener('click', e => {
    const id = Number(e.target.dataset.id);
    if(!id) return;

    if(e.target.classList.contains('check')){
      const todo = todos.find(t => t.id === id);
      todo.done = !todo.done;
      if(todo.done){
        completedLog.push({
          id: todo.id,
          text: todo.text,
          priority: todo.priority,
          list: todo.list,
          completedAt: new Date()
        });
      } else {
        const idx = completedLog.map(e => e.id).lastIndexOf(id);
        if(idx > -1) completedLog.splice(idx, 1);
      }
      renderTodos();
    }
    if(e.target.classList.contains('del')){
      todos = todos.filter(t => t.id !== id);
      renderTodos();
    }
  });

  renderTodos();

  // ================= Spotify (simple embed player) =================
  const spotifyLinkInput = document.getElementById('spotifyLinkInput');
  const spotifyLoadBtn = document.getElementById('spotifyLoadBtn');
  const spotifyEmbedWrap = document.getElementById('spotifyEmbedWrap');

  function parseSpotifyLink(input){
    const match = input.match(/spotify\.com\/(track|playlist|album)\/([a-zA-Z0-9]+)/);
    if(match) return { type: match[1], id: match[2] };
    const uriMatch = input.match(/spotify:(track|playlist|album):([a-zA-Z0-9]+)/);
    if(uriMatch) return { type: uriMatch[1], id: uriMatch[2] };
    return null;
  }

  function loadSpotifyEmbed(){
    const parsed = parseSpotifyLink(spotifyLinkInput.value.trim());
    if(!parsed){
      spotifyEmbedWrap.innerHTML = '<p class="side-copy">That doesn\'t look like a Spotify link. Paste a track, album, or playlist URL from Spotify.</p>';
      return;
    }
    spotifyEmbedWrap.innerHTML = `
      <iframe
        style="border-radius:12px;"
        src="https://open.spotify.com/embed/${parsed.type}/${parsed.id}"
        width="100%"
        height="152"
        frameborder="0"
        allowfullscreen=""
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
        loading="lazy">
      </iframe>`;
  }

  spotifyLoadBtn.addEventListener('click', loadSpotifyEmbed);
  spotifyLinkInput.addEventListener('keydown', e => {
    if(e.key === 'Enter') loadSpotifyEmbed();
  });

  // ================= Alarm clock (for other tasks) =================
  const alarmLabelInput = document.getElementById('alarmLabelInput');
  const alarmTimeInput = document.getElementById('alarmTimeInput');
  const addAlarmBtn = document.getElementById('addAlarmBtn');
  const alarmList = document.getElementById('alarmList');
  const alarmCount = document.getElementById('alarmCount');

  let alarms = []; // {id, label, time: 'HH:MM', lastFiredDate: 'YYYY-MM-DD'|null}
  let alarmIdCounter = 0;

  if('Notification' in window && Notification.permission === 'default'){
    // Ask once, quietly, the first time an alarm is added rather than on load.
  }

  function renderAlarms(){
    alarmList.innerHTML = '';
    if(alarms.length === 0){
      alarmList.innerHTML = `
        <li class="empty-state">
          <div class="stub">No alarms set</div>
          Add a time above for a reminder outside your focus sessions.
        </li>`;
    } else {
      alarms
        .slice()
        .sort((a,b) => a.time.localeCompare(b.time))
        .forEach(alarm => {
          const li = document.createElement('li');
          li.className = 'ticket';
          li.innerHTML = `
            <span class="tag" style="color:var(--sage); background:rgba(127,165,131,0.14);">${alarm.time}</span>
            <span class="ticket-text">${alarm.label}</span>
            <button class="del" data-id="${alarm.id}">✕</button>
          `;
          alarmList.appendChild(li);
        });
    }
    alarmCount.textContent = `${alarms.length} set`;
  }

  addAlarmBtn.addEventListener('click', () => {
    const label = alarmLabelInput.value.trim();
    const time = alarmTimeInput.value;
    if(!label || !time) return;
    if('Notification' in window && Notification.permission === 'default'){
      Notification.requestPermission();
    }
    alarmIdCounter++;
    alarms.push({ id: alarmIdCounter, label, time, lastFiredDate: null });
    alarmLabelInput.value = '';
    alarmTimeInput.value = '';
    renderAlarms();
  });

  alarmList.addEventListener('click', e => {
    const id = Number(e.target.dataset.id);
    if(!id) return;
    if(e.target.classList.contains('del')){
      alarms = alarms.filter(a => a.id !== id);
      renderAlarms();
    }
  });

  function checkAlarms(){
    const now = new Date();
    const hh = String(now.getHours()).padStart(2,'0');
    const mm = String(now.getMinutes()).padStart(2,'0');
    const currentTime = `${hh}:${mm}`;
    const today = now.toISOString().slice(0,10);

    alarms.forEach(alarm => {
      if(alarm.time === currentTime && alarm.lastFiredDate !== today){
        alarm.lastFiredDate = today;
        playChime();
        if('Notification' in window && Notification.permission === 'granted'){
          new Notification(alarm.label, { body: 'Alarm from Focus Ticket' });
        }
      }
    });
  }

  setInterval(checkAlarms, 15000);
  renderAlarms();

  // ================= PWA install support =================
  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(() => {
        // No service worker file present yet — app still works without it,
        // it just won't be installable until you add service-worker.js.
      });
    });
  }
</script>
